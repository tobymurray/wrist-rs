[package]
name = "wrist-l10n-gen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Compiles l10n/ and CLDR's data into wrist-display's generated l10n module, and checks it"

[dependencies]
fluent-syntax = "0.12"
icu = "2.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
writeable = "0.6"

[dev-dependencies]
wrist-display.workspace = true

[lints]
workspace = true
