[package]
name = "bluenrg2-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Not a member of the repository's workspace: `cargo fuzz run decode` from crates/bluenrg2.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bluenrg2 = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
