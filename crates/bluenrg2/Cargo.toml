[package]
name = "bluenrg2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "ST's BlueNRG-2 Bluetooth network coprocessor: SPI framing, HCI and ACI command packets, and event decoding. no_std, no allocation"
repository = "https://github.com/tobymurray/wrist-rs"
readme = "README.md"
keywords = ["bluetooth", "ble", "hci", "bluenrg", "embedded"]
categories = ["embedded", "hardware-support", "no-std", "no-std::no-alloc"]

[dependencies]
bt-hci = { version = "0.11.0", default-features = false }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
