[package]
name = "wrist-bluenrg2"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "The BlueNRG-2 as the Bluetooth core sees it: its limits, its link-layer scheduler from ST's PM0257, its own refusal codes, its packets as the core's events, and the SPI handshake that carries them. no_std, no allocation"

[dependencies]
bluenrg2 = { path = "../bluenrg2" }
wrist-ble = { path = "../wrist-ble" }
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
