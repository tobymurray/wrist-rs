[package]
name = "wrist-aci-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Not a member of the repository's workspace: `cargo fuzz run decode` from crates/wrist-aci.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
wrist-aci = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
