[package]
name = "wrist-glass"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The watch face, laid out and checked on the host"
publish = false

[features]
# PNGs of the tests' cases.
preview = ["inscribed-disc/preview"]

[dependencies]
inscribed-disc = { version = "0.2.1", default-features = false, features = ["embedded-graphics", "abgr2222"] }
embedded-graphics = { version = "0.8", default-features = false }
incised-text = { version = "0.2.1", default-features = false, features = ["abgr2222", "atkinson"] }
wrist-l10n = { path = "../wrist-l10n" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
