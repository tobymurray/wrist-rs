[workspace]
resolver = "2"
members = ["crates/wrist-bluenrg2", "crates/bluenrg2", "crates/wrist-ble", "crates/wrist-ble-core", "crates/wrist-ble-sim", "crates/wrist-board", "crates/wrist-crash", "crates/wrist-eeprom", "crates/wrist-flash", "crates/wrist-glass", "crates/wrist-haptic", "crates/wrist-l10n", "crates/wrist-l10n-gen", "crates/wrist-pages", "crates/wrist-panel", "crates/wrist-store", "crates/wrist-time", "crates/wrist-power", "crates/wrist-profiles", "crates/wrist-vcom", "crates/wrist-wake", "crates/wrist-installer-ui"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# This repository's bluenrg2. Uncomment inscribed-disc to build against a watch-apps checkout beside
# this repository.
[patch.crates-io]
bluenrg2 = { path = "crates/bluenrg2" }
# inscribed-disc = { path = "../watch-apps/InscribedDisc" }
