[workspace]
resolver = "2"
members = ["crates/wrist-aci", "crates/wrist-board", "crates/wrist-eeprom", "crates/wrist-flash", "crates/wrist-glass", "crates/wrist-l10n", "crates/wrist-l10n-gen", "crates/wrist-pages", "crates/wrist-time", "crates/wrist-power", "crates/wrist-vcom", "crates/wrist-wake"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

