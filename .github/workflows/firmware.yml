name: Firmware candidates and releases
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new versioned release (run on an existing vA.B.C tag only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Read the pinned build image and SDK
        id: pins
        run: |
          set -euo pipefail
          python3 source/tools/release-docker.py --pins | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.sdk_repository }}
          ref: ${{ steps.pins.outputs.sdk_commit }}
          persist-credentials: false
          path: sdk
      # One cache: the three target directories and Cargo's downloads (CARGO_HOME without bin/
      # or the unpacked sources). Only main saves it, once for each set of inputs, so a pull
      # request reads main's and never pushes it out of the repository's 10 GB. A tag builds
      # cold: nothing from an earlier build reaches a release.
      - name: Restore the build cache
        id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@v6
        with:
          path: |
            source/target
            source/apps/standalone-boot/target
            source/apps/wrist-loader/target
            cargo-home/registry/index
            cargo-home/registry/cache
            cargo-home/git/db
          key: firmware-v2-${{ runner.os }}-${{ hashFiles('source/Cargo.lock', 'source/apps/standalone-boot/Cargo.lock', 'source/apps/wrist-loader/Cargo.lock', 'source/release/Dockerfile', 'source/release/toolchain.json') }}
          restore-keys: |
            firmware-v2-${{ runner.os }}-
      - name: Build, lint, test and package in the pinned build image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git -C source rev-parse HEAD)
          version="0.0.0-candidate.${commit:0:12}"
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; fi
          python3 source/tools/release-docker.py --sdk "$PWD/sdk" --out "$RUNNER_TEMP/firmware" --version "$version" \
            --cargo-home "$PWD/cargo-home"
      # Incremental state is redone for every change, so it is not kept.
      - name: Trim the build cache
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf source/target/debug/incremental
      - name: Save the build cache
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            source/target
            source/apps/standalone-boot/target
            source/apps/wrist-loader/target
            cargo-home/registry/index
            cargo-home/registry/cache
            cargo-home/git/db
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Every candidate is attested, so the gate can check the zips it installs; publish
      # releases these same zips.
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-path: '${{ runner.temp }}/firmware/*.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            ${{ runner.temp }}/firmware/*.zip
            ${{ runner.temp }}/firmware/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require documented owner decisions and hardware evidence
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open('release/gate.json'))
          assert g['hardware_install_numbers'], 'the round trip has no numbered hardware evidence'
          assert g['stock_version'], 'no stock version validated for the installer'
          assert g['image_crc32'], 'no gated image CRC'
          assert g['round_trip_fingerprint'], 'no round-trip fingerprint'
          for k in ['round_trip_validated', 'license_distribution_approved', 'notices_reviewed', 'github_candidate_run_verified']:
              assert g[k] is True, f'release gate open: {k}'
          PY
      - uses: actions/download-artifact@v8
        with:
          name: firmware-${{ github.sha }}
          path: assets
      - name: Check asset integrity and refuse replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          gate = json.load(open('release/gate.json'))
          gated = gate['image_crc32']
          zips = list(pathlib.Path('assets').glob('*.zip'))
          assert zips, 'no release archives'
          for path in zips:
              with zipfile.ZipFile(path) as z:
                  m = json.loads(z.read('manifest.json'))
              assert m['release_ready'] is True and not m['checks_skipped'] and not m['dirty']
              assert m['source_commit'] == os.environ['SOURCE_SHA']
              assert 'v' + m['version'] == os.environ['RELEASE_TAG']
              # The image the gate installed, which the build ID carries through the gate's commit.
              assert gated and m['image_crc32'] == gated, f"{path.name}: image {m['image_crc32']} is not the gated {gated}"
              # The installer and loader the round trip ran, perhaps in an earlier release.
              assert m['round_trip_fingerprint'] == gate['round_trip_fingerprint'], f"{path.name}: installer or loader not the round trip's"
          PY
          # List first: authentication/network failures fail closed, not "not found".
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq -- "$RELEASE_TAG" /tmp/release-tags; then
            echo 'Refusing to replace an existing release'; exit 1
          fi
      - name: Create a new durable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" assets/*.zip assets/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --notes-file release/NOTES.md
      - name: Redeploy the download page with this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GitHub docs, "Triggering a workflow from a workflow".
        run: gh workflow run pages.yml --ref main
