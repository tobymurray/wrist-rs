[package]
name = "standalone-boot"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "wrist-rs firmware for the UNA Watch"

[workspace]

[dependencies]
cortex-m-rt = "0.7.7"
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
# No `memory-x`: memory.x here places the image at its partition.
embassy-stm32 = { version = "0.6.0", features = ["stm32u5a5qj", "time-driver-lptim4", "low-power", "executor-thread", "rt", "time", "exti"] }
embassy-executor = { version = "0.10.0", features = ["trace"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
static_cell = "2.1.1"
critical-section = "1.2"
embassy-usb = { version = "0.6.0", default-features = false }
log = { version = "0.4", default-features = false, optional = true }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-boot-stm32 = "0.8.0"
wrist-flash = { path = "../../crates/wrist-flash" }
bluenrg2 = { version = "0.1.1", optional = true }
wrist-ble = { path = "../../crates/wrist-ble", optional = true }
wrist-ble-core = { path = "../../crates/wrist-ble-core", optional = true }
wrist-ble-shadow = { path = "../../crates/wrist-ble-shadow", optional = true }
wrist-bluenrg2 = { path = "../../crates/wrist-bluenrg2", optional = true }
wrist-wake = { path = "../../crates/wrist-wake", optional = true }
wrist-board = { path = "../../crates/wrist-board" }
wrist-glass = { path = "../../crates/wrist-glass" }
wrist-haptic = { path = "../../crates/wrist-haptic" }
wrist-pages = { path = "../../crates/wrist-pages" }
wrist-time = { path = "../../crates/wrist-time" }
wrist-crash = { path = "../../crates/wrist-crash" }
wrist-eeprom = { path = "../../crates/wrist-eeprom" }
wrist-power = { path = "../../crates/wrist-power" }
wrist-vcom = { path = "../../crates/wrist-vcom" }
wrist-panel = { path = "../../crates/wrist-panel" }

[features]
# embassy-usb's own log of the link, printed by `usblog`.
usb-log = ["dep:log", "embassy-usb/log"]
# The console and application updates over Bluetooth, for a bonded central (ble.rs). The radio
# stays in reset until `ble on`.
ble = ["dep:bluenrg2", "dep:wrist-ble", "dep:wrist-ble-core", "dep:wrist-ble-shadow", "dep:wrist-bluenrg2", "dep:wrist-wake"]
# `ble probe`: the BlueNRG-2's firmware, updater and anchor period on the console.
ble-probe = ["ble"]
# Every packet to and from the BlueNRG-2 on the console, for replaying through the core on a host.
ble-trace = ["ble"]

[[bin]]
name = "standalone-boot"
test = false
bench = false

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
debug = true
codegen-units = 1

[profile.dev]
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Every Embassy crate on one revision, so their types match (vendor/*/WRIST-PATCHES.md).
[patch.crates-io]
embassy-stm32 = { path = "../../vendor/embassy-stm32" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-usb-synopsys-otg = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "cf9beb7173159ce1b60dadb9be11583c20c7949a" }

# What draws the face is built for speed rather than size.
[profile.release.package.wrist-glass]
opt-level = 3
[profile.release.package.incised-text]
opt-level = 3
[profile.release.package.inscribed-disc]
opt-level = 3
[profile.release.package.wrist-panel]
opt-level = 3
[profile.release.package.wrist-l10n]
opt-level = 3
