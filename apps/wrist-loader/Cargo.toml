[package]
name = "wrist-loader"
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "The stage-two loader at the UNA kernel base: embassy-boot over bank 1, so the application updates itself in place"

# Its own workspace: it only links for the watch.
[workspace]

[dependencies]
cortex-m-rt = "0.7.7"
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32u5a5qj"] }
embassy-boot-stm32 = "0.8.0"
embassy-sync = "0.8.0"

[[bin]]
name = "wrist-loader"
test = false
bench = false

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
debug = true
codegen-units = 1

[profile.dev]
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
