<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 282" role="img" aria-label="From wrist-rs back to stock: hold Select until the USB screen, 3 to 16 s, copy the .ota to UNA BOOT, unplug and Continue">
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <g>
    <circle cx="120" cy="120" r="100" fill="#2B2E33" stroke="#4A4F57" stroke-width="4"/>
