  <text x="360" y="264" font-size="28" font-weight="600" fill="#6B7078" text-anchor="middle">Hold Select 3–16 s</text>
  <g fill="none" stroke="#8C9199" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="222" y1="120" x2="258" y2="120"/><polyline points="244,106 258,120 244,134"/>
  </g>
  <g>
