    <text x="600" y="130" font-size="26" fill="#F2EFE9" font-weight="600" text-anchor="middle">UNA BOOT</text>
  </g>
  <text x="600" y="264" font-size="28" font-weight="600" fill="#6B7078" text-anchor="middle">Copy the .ota</text>
  <g fill="none" stroke="#8C9199" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
