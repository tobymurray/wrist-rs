  </g>
  <text x="840" y="264" font-size="28" font-weight="600" fill="#6B7078" text-anchor="middle">Unplug, Continue</text>
  <g fill="none" stroke="#8C9199" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="702" y1="120" x2="738" y2="120"/><polyline points="724,106 738,120 724,134"/>
  </g>
  <g>
    <circle cx="1080" cy="120" r="100" fill="#2B2E33" stroke="#4A4F57" stroke-width="4"/>
